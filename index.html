<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>Mummy Meals - Ghar ka khana, Maa ke haathon se</title>
    <meta name="description" content="Daily meals from nearby moms, cooked fresh & delivered hot. Home-cooked food for bachelors and working professionals." />
    <meta name="author" content="Neetesh Kumar" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://amklbbxnfhudzcgnvlfk.supabase.co" />
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="Mummy Meals - Home-cooked Food Delivery" />
    <meta property="og:description" content="Daily meals from nearby moms, cooked fresh & delivered hot" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mummy-meals-connect.lovable.app/" />
    <meta property="og:image" content="https://mummy-meals-connect.lovable.app/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="canonical" href="https://mummy-meals-connect.lovable.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mummymeals" />
    <meta name="twitter:title" content="Mummy Meals - Home-cooked Food Delivery" />
    <meta name="twitter:description" content="Daily meals from nearby moms, cooked fresh & delivered hot" />
    <meta name="twitter:image" content="https://mummy-meals-connect.lovable.app/og-preview.jpg" />


    <!-- Google Fonts with display=swap for faster text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#f97316" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before first paint so the loading screen and
      // dashboards never flash the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("mummy-meals-theme");
          if (t !== "light" && t !== "dark" && t !== "comfort") t = "light";
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
